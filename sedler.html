<!doctype html>
<html>
  <head>
    <title>representing time</title>
  </head>
  <style type="text/css">
    #canvas-container canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
  <body>
    <div id="canvas-container"></div>
  </body>
  <script
    type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.min.js"
  ></script>
  <script type="text/javascript">
const tiles = 
  {
    "NOK": [
      {
        "value": 50,
        "color": "blue"
      },
      {
        "value": 100,
        "color": "green"
      },
      {
        "value": 1000,
        "color": "purple"
      },
    ],
    "USD": [
      {
        "value": 50,
        "color": "blue"
      },
      {
        "value": 200,
        "color": "red"
      },
      {
        "value": 500,
        "color": "yellow"
      },
    ],
    "SEK": [
      {
        "value": 50,
        "color": "blue"
      },
    ]
  }

const rectSize = 30;

function setup() {
  createCanvas(400, 400);

  let index = 0
  for (const [valuta, sedler] of Object.entries(tiles)) {
    fill("black")
    text(valuta, index, rectSize)
    for (seddel of sedler) {
      fill(seddel["color"])
      rect(index, 10 + seddel["value"], rectSize, rectSize)
    }
    index += rectSize;
  }
  


}
  </script>
</html>
